name: docs

on:
  push:
    branches: [main]
    paths: ["book/**", "docs/**", "README.md", "CHANGELOG.md", "src/cli/**", "scripts/gen-cli-reference.sh", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["book/**", "docs/**", "README.md", "CHANGELOG.md", "src/cli/**", "scripts/gen-cli-reference.sh", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook and lychee
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,lychee
      - name: Build the site
        run: |
          cargo build --quiet
          ./scripts/gen-cli-reference.sh
          mdbook build book
      - name: Check links
        run: lychee --offline --no-progress --exclude-path 404.html 'book/book/**/*.html'
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: book/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
