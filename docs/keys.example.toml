# MPDFM keymap — ~/.config/mpdfm/keys.toml
#
# Every binding is optional, and this file as shipped changes nothing: the
# built-in keys are vim-style and meant to need no configuration. Copy it,
# uncomment what you want to change.
#
# What is in here is merged *over* the defaults, so a section that mentions one
# key leaves the other thirty alone. Press `?` inside MPDFM to see the keymap you
# actually have — that overlay is generated from it, so it is never out of date.
#
# A line that MPDFM cannot use is a warning at start-up and nothing more: the rest
# of the file still applies, and the program still starts. An unknown action name
# gets a warning that lists the names there are.
#
#
# SECTIONS are modes. A key can mean different things in different ones, which is
# why `ctrl-u` is half a page up in the browser and clear-the-line in the command
# line.
#
#   [browser]   the library browser
#   [pending]   the staged-operations view
#   [tagedit]   the tag editor
#   [search]    the search / filter line
#   [command]   the `:` line
#
# KEYS are written as the help overlay writes them:
#
#   j  G  /  -  ?            a single character is itself, capital included
#   enter esc tab space      and so are these, plus: backtab, backspace, delete,
#   up down left right       insert, home, end, pageup, pagedown, f1 … f12
#   ctrl-d  alt-x  shift-j   modifiers are spelled out in full, lower case
#   gg  ctrl-x s             two keys in a row: written together when both are
#                            plain characters, with a space otherwise
#
# `shift` on a letter is the same thing as the capital: "J" and "shift-j" are one
# binding, because terminals disagree about which of the two they report. Stick to
# ctrl, alt and plain capitals for anything you want to work everywhere —
# `ctrl-shift-x` is reported inconsistently, and while MPDFM normalizes the two
# spellings it has no way to make a terminal send one at all.
#
# ACTIONS are the names below. `= "none"` removes a binding instead of adding one,
# which is the only way to free a key up.


# -- the browser ------------------------------------------------------------
#
# [browser]
#
# An extra key for something that already has one. `R` still rescans; this is in
# addition, not instead.
# "ctrl-r" = "rescan"
#
# A key that was not bound at all.
# "J" = "half_page_down"
# "K" = "half_page_up"
#
# Moving a key: the new one works and the old one does not.
# "x" = "none"
# "D" = "discard_pending"
#
# A two-key sequence. Beware of binding its first key on its own — `"g" = "top"`
# makes `gg` unreachable, and MPDFM says so at start-up rather than letting you
# wonder.
# "g e" = "edit_tags"


# -- the staged-operations view ---------------------------------------------
#
# The screen that shows what is about to happen: one row per staged operation,
# the playlists they rewrite, and the conflicts that refuse them. `enter`, `l`
# and `h` unfold and fold a row — a playlist into every line that changes, a
# refused operation into the reason — and the cursor walks into a diff, so a long
# one scrolls rather than being cut short.
#
# `dd` takes the operation under the cursor off the plan, `c` commits, `x`
# discards the lot after a confirmation, and `u` undoes the transaction that was
# just committed. While a commit is running, `esc` calls it off if it is still
# before the first change to the library, and says so plainly if it is not.
#
# `d` is the first half of `dd` in here and stages a delete in the browser, which
# is the one key that means different things in the two. Binding it to something
# on its own makes `dd` unreachable, and MPDFM says so at start-up.
#
# [pending]
# "D" = "discard_pending"
# "ctrl-y" = "commit"


# -- the tag editor (task 23) -----------------------------------------------
#
# One mode with two states in it. Between the form's fields a bare letter is a
# verb — `j` and `k` move, `i` types, `w` stages, `T` and `N` run the per-file
# actions, `C` clears a field. Inside a field that is open for typing, a key that
# types a character types it and nothing else, so `j` is a `j` in there; every
# other key keeps its binding, filtered to the actions a field can use (left,
# right, up, down, delete_char, clear_line, submit, cancel).
#
# So a letter bound here is a verb between fields and still typeable in one, and
# the only bindings that change what typing does are those eight.
#
# [tagedit]
# "ctrl-s" = "stage_tags"
# "ctrl-w" = "stage_and_commit"
# "a" = "edit_field"


# -- the search line (task 25) ----------------------------------------------
#
# [search]
# "ctrl-j" = "search_next"
# "ctrl-k" = "search_prev"


# -- the command line -------------------------------------------------------
#
# [command]
# "ctrl-k" = "clear_line"


# -- every action -----------------------------------------------------------
#
# Moving around
#   down                 move down
#   up                   move up
#   left                 left / out
#   right                right / in
#   top                  first row
#   bottom               last row
#   half_page_down       half page down
#   half_page_up         half page up
#   open                 enter dir / open
#   parent               parent dir
#   switch_pane          switch pane
#
# Marking
#   toggle_mark          mark / unmark
#   visual_select        visual-select range
#   mark_all             mark all in view
#   unmark_all           unmark all
#
# Changing things
#   edit_tags            edit tags
#   edit_field           type into this field
#   clear_field          clear this field
#   title_from_filename  titles from filenames
#   renumber_tracks      renumber tracks
#   stage_tags           stage the tag edit
#   stage_and_commit     stage the tag edit and commit
#   stage_move           stage a move of the marks
#   rename               rename
#   stage_delete         stage a delete
#   unstage              unstage this operation
#   organize             organize by template
#   show_pending         show pending ops
#   commit               commit pending
#   discard_pending      discard pending
#   undo                 undo last transaction
#
# Finding things
#   search               search
#   search_next          next match
#   search_prev          prev match
#   filter               filter
#
# Typing
#   submit               accept
#   delete_char          delete a character
#   clear_line           clear the line
#
# The rest
#   cancel               clear filter / close overlay
#   command_mode         command mode
#   help                 help overlay
#   rescan               rescan library
#   quit                 quit (warns if ops pending)
#   force_quit           quit, discarding pending ops
#
#   none                 not an action: removes the binding
#
#
# `ctrl-c` is not in the table and cannot be rebound. It quits — asking first if
# anything is staged, and leaving regardless on the second press. An escape hatch
# that can be remapped away is not one.
