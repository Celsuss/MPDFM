[workspace]
members = ["crates/core"]

# Versions are pinned exactly (`=x.y.z`); bumping one is a deliberate act.
[workspace.dependencies]
mpdfm-core = { path = "crates/core" }

anyhow = "=1.0.104"
# Drives the real `mpdfm` binary from the integration tests (task 15): the same
# path the user takes, rather than calling `cli::run` in-process.
assert_cmd = "=2.2.2"
camino = { version = "=1.2.6", features = ["serde1"] }
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.29.0"
insta = "=1.48.0"
lofty = "=0.25.4"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# `SIGTERM` has to reach the TUI's event loop rather than the kernel's default
# disposition, or a `kill` leaves the user in raw mode on the alternate screen
# (task 20). Already in the tree — `crossterm` uses it for `SIGWINCH` — so this
# is a direct name for a crate that was being compiled anyway.
signal-hook = "=0.3.18"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.6"
walkdir = "=2.5.0"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/Celsuss/MPDFM"

[package]
name = "mpdfm"
description = "Edit tags and re-organize an MPD music library without breaking playlists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mpdfm-core.workspace = true

anyhow.workspace = true
camino.workspace = true
clap.workspace = true
# The terminal, and the widgets drawn on it (task 20). Both live here and not in
# core: the dependency direction is one-way, and `crates/core/tests/manifest_deps.rs`
# keeps it that way.
crossterm.workspace = true
ratatui.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
# The TUI's own error types: a bad `keys.toml` line and an unrunnable `:` command
# are both things the user reads, so their `Display` is the message and belongs
# next to the variant (task 21).
thiserror.workspace = true
# `src/tui/keys.rs` reads `keys.toml`. Already in the tree for core's `config.toml`;
# the keymap is parsed here and not there because a key binding is `crossterm`'s
# vocabulary, which core does not have (`crates/core/tests/manifest_deps.rs`).
toml.workspace = true

# `tests/` drives the built binary against a `Fixture`, which lives behind
# core's `testing` feature. Cargo unifies this with the dependency above, so the
# lib is still built once — and a `cargo build` resolves no dev-dependency at
# all, which is what keeps the fixture builder out of a release binary.
[dev-dependencies]
mpdfm-core = { workspace = true, features = ["testing"] }

assert_cmd.workspace = true
# `src/tui/log.rs` writes a real log file in its own tests, and `tests/` needs a
# scratch directory for the pty checks.
tempfile.workspace = true

[profile.release]
strip = true
