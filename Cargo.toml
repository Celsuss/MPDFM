[workspace]
members = ["crates/core"]

# Versions are pinned exactly (`=x.y.z`); bumping one is a deliberate act.
[workspace.dependencies]
mpdfm-core = { path = "crates/core" }

anyhow = "=1.0.104"
# Drives the real `mpdfm` binary from the integration tests (task 15): the same
# path the user takes, rather than calling `cli::run` in-process.
assert_cmd = "=2.2.2"
camino = { version = "=1.2.6", features = ["serde1"] }
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.29.0"
insta = "=1.48.0"
lofty = "=0.25.4"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.6"
walkdir = "=2.5.0"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/Celsuss/MPDFM"

[package]
name = "mpdfm"
description = "Edit tags and re-organize an MPD music library without breaking playlists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mpdfm-core.workspace = true

anyhow.workspace = true
camino.workspace = true
clap.workspace = true
serde_json.workspace = true

# `tests/` drives the built binary against a `Fixture`, which lives behind
# core's `testing` feature. Cargo unifies this with the dependency above, so the
# lib is still built once — and a `cargo build` resolves no dev-dependency at
# all, which is what keeps the fixture builder out of a release binary.
[dev-dependencies]
mpdfm-core = { workspace = true, features = ["testing"] }

assert_cmd.workspace = true

[profile.release]
strip = true
