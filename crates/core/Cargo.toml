[package]
name = "mpdfm-core"
description = "Library, playlist and tag logic for MPDFM — no terminal, no CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The fixture builder in `src/testing/`. Off in a normal build, so a release
# binary carries none of it; core's own tests switch it on through the
# dev-dependency on itself below, which is why `cargo test` needs no extra flag.
[features]
testing = ["dep:tempfile"]

# Core stays free of `clap`, `crossterm` and `ratatui` on purpose; the
# dependency direction is one-way. `tests/manifest_deps.rs` enforces it.
[dependencies]
camino.workspace = true
serde.workspace = true
# The journal is JSON on disk (task 11, `docs/PLAN.md` §7): one record per
# transaction, read back after a crash by a build that may be newer than the one
# that wrote it. `serde_json::Value` is also what holds a future version's
# unknown fields so that writing a record back cannot drop them.
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
walkdir.workspace = true

tempfile = { workspace = true, optional = true }

[dev-dependencies]
# Depending on ourselves with `testing` on is what makes `mpdfm_core::testing`
# visible to this crate's own unit and integration tests. Cargo unifies the two
# resolutions, so the lib is still built once.
mpdfm-core = { path = ".", features = ["testing"] }

insta.workspace = true
tempfile.workspace = true
